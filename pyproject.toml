[project]
name = "freeeval"
version = "0.1.0"
description = "HTTP API for evaluating prompts, RAG pipelines, and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freeeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
